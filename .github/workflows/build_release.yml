name: Build macOS Release

# Triggers:
#   - Pushing a version tag:  git tag v1.0.0 && git push --tags
#   - Manual trigger from the GitHub Actions tab
on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version label (e.g. 1.0.0)'
        required: false
        default: 'dev'

jobs:
  build-macos:
    runs-on: macos-latest
    timeout-minutes: 45
    permissions:
      contents: write   # required to create releases and upload assets

    steps:
      # ── Checkout ────────────────────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── Python ──────────────────────────────────────────────────────────────
      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: 'pip'

      # ── Dependencies ────────────────────────────────────────────────────────
      - name: Install runtime dependencies
        run: pip install -r requirements.txt

      - name: Install build dependencies
        run: pip install -r build_requirements.txt

      # ── Build .app ──────────────────────────────────────────────────────────
      - name: Build .app bundle
        run: pyinstaller Adeptus_Craftmatica.spec --noconfirm

      # ── Create DMG ──────────────────────────────────────────────────────────
      - name: Install create-dmg
        run: brew install create-dmg

      - name: Create DMG
        run: |
          # Attempt polished DMG; fall back to hdiutil on any error
          create-dmg \
            --volname "Adeptus Craftmatica" \
            --window-pos 200 140 \
            --window-size 660 400 \
            --icon-size 120 \
            --icon "Adeptus Craftmatica.app" 180 170 \
            --hide-extension "Adeptus Craftmatica.app" \
            --app-drop-link 480 170 \
            --no-internet-enable \
            "dist/Adeptus_Craftmatica.dmg" \
            "dist/Adeptus Craftmatica.app" || \
          hdiutil create \
            -volname "Adeptus Craftmatica" \
            -srcfolder "dist/Adeptus Craftmatica.app" \
            -ov -format UDZO \
            "dist/Adeptus_Craftmatica.dmg"

      # ── Determine version label ──────────────────────────────────────────────
      - name: Resolve version
        id: version
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            echo "label=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"
          else
            echo "label=${{ github.event.inputs.version || 'dev' }}" >> "$GITHUB_OUTPUT"
          fi

      # ── Upload artefact (always available in Actions tab) ──────────────────
      - name: Upload DMG as artefact
        uses: actions/upload-artifact@v4
        with:
          name: Adeptus-Craftmatica-macOS-${{ steps.version.outputs.label }}
          path: dist/Adeptus_Craftmatica.dmg
          retention-days: 30

      # ── Attach to GitHub Release (tag builds only) ─────────────────────────
      - name: Attach DMG to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/Adeptus_Craftmatica.dmg

  build-windows:
    runs-on: windows-latest
    timeout-minutes: 45
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: 'pip'

      - name: Install runtime dependencies
        run: pip install -r requirements.txt

      - name: Install build dependencies
        run: pip install -r build_requirements.txt

      - name: Build .exe
        run: pyinstaller Adeptus_Craftmatica.spec --noconfirm

      - name: Create ZIP
        run: |
          Compress-Archive -Path "dist\Adeptus Craftmatica\*" `
            -DestinationPath "dist\Adeptus_Craftmatica_Windows.zip"
        shell: pwsh

      - name: Resolve version
        id: version
        shell: bash
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            echo "label=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"
          else
            echo "label=${{ github.event.inputs.version || 'dev' }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload ZIP as artefact
        uses: actions/upload-artifact@v4
        with:
          name: Adeptus-Craftmatica-Windows-${{ steps.version.outputs.label }}
          path: dist/Adeptus_Craftmatica_Windows.zip
          retention-days: 30

      - name: Attach ZIP to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/Adeptus_Craftmatica_Windows.zip
